<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">

<style>
  .bg { fill: #faf9f6; }
  .frame { fill: none; stroke: #1c1712; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
  .ink { fill: none; stroke: #1c1712; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .ink-thin { fill: none; stroke: #1c1712; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ink-thick { fill: none; stroke: #1c1712; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
  .head { fill: #ffffff; stroke: #1c1712; stroke-width: 3.2; }
  .eye { fill: #1c1712; }
  .shade { fill: #e2e8f0; opacity: 0.7; }
  .shade-dark { fill: #cbd5e1; opacity: 0.8; }
  .accent-yellow { fill: #fbbf24; opacity: 0.9; }
  .accent-amber { fill: #f59e0b; }
  .accent-red { fill: #ef4444; }
  .accent-green { fill: #10b981; }
  .accent-blue { fill: #3b82f6; }
  .stroke-red { stroke: #ef4444; stroke-width: 3; stroke-dasharray: 6 4; fill: none; stroke-linecap: round; }
  .stroke-green { stroke: #10b981; stroke-width: 3.5; fill: none; stroke-linecap: round; }
  .stroke-blue { stroke: #3b82f6; stroke-width: 3; fill: none; stroke-linecap: round; }
  .phone-body { fill: #ffffff; stroke: #1c1712; stroke-width: 3; rx: 10; }
  .phone-screen { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 6; }
</style>

  <rect class="bg" width="400" height="500" rx="16"/>
  <rect class="frame" x="8" y="8" width="384" height="484" rx="12"/>

  <!-- Cafe Window Background Line -->
  <path class="ink-thin" d="M 30 60 H 370 V 220 H 30 Z" />
  <path class="shade" d="M 30 60 H 370 V 220 H 30 Z" opacity="0.3" />
  <path class="ink-thin" d="M 200 60 V 220 M 30 140 H 370" />

  <!-- Cafe Table -->
  <ellipse cx="200" cy="360" rx="150" ry="40" class="shade" />
  <ellipse cx="200" cy="355" rx="150" ry="40" class="head" />
  <path class="ink-thick" d="M 50 355 C 50 375, 350 375, 350 355" />
  <!-- Table Legs -->
  <path class="ink-thick" d="M 190 380 V 460 M 210 380 V 460 M 150 460 H 250" />

  <!-- Coffee Mugs on Table -->
  <!-- Mug 1 -->
  <rect x="130" y="325" width="22" height="26" rx="4" class="head" />
  <path class="ink-thin" d="M 130 332 C 120 332, 120 344, 130 344" />
  <path class="ink-thin" stroke="#94a3b8" d="M 136 318 Q 141 310 136 302" /> <!-- Steam -->

  <!-- Mug 2 -->
  <rect x="245" y="325" width="22" height="26" rx="4" class="head" />
  <path class="ink-thin" d="M 267 332 C 277 332, 277 344, 267 344" />
  <path class="ink-thin" stroke="#94a3b8" d="M 251 318 Q 256 310 251 302" /> <!-- Steam -->

  <!-- Character 1 (Left - Phú) -->
  <circle cx="95" cy="240" r="30" class="head" />
  <circle cx="103" cy="235" r="3" class="eye" />
  <circle cx="113" cy="235" r="3" class="eye" />
  <path class="ink" d="M 100 252 Q 108 260 116 250" /> <!-- Talking mouth -->
  <path class="ink-thick" d="M 95 270 L 95 350 M 95 300 L 135 328" /> <!-- Body & hand gesturing -->

  <!-- Character 2 (Right - Friend) -->
  <circle cx="305" cy="240" r="30" class="head" />
  <circle cx="287" cy="235" r="3" class="eye" />
  <circle cx="297" cy="235" r="3" class="eye" />
  <path class="ink" d="M 284 250 Q 292 260 300 252" /> <!-- Listening/debating mouth -->
  <path class="ink-thick" d="M 305 270 L 305 350 M 305 300 L 265 328" /> <!-- Body & hand gesturing -->

  <!-- SPEECH BUBBLE WITH CHESS MATCH DEBATE (King vs Pawn) -->
  <g transform="translate(120, 80)">
    <path d="M 10 10 H 150 Q 160 10 160 20 V 80 Q 160 90 150 90 H 60 L 40 110 L 45 90 H 10 Q 0 90 0 80 V 20 Q 0 10 10 10 Z" fill="#ffffff" stroke="#1c1712" stroke-width="3" />
    
    <!-- Chess King outline -->
    <path class="ink" d="M 35 65 H 55 L 52 45 L 57 38 L 45 35 L 33 38 L 38 45 Z M 45 25 V 35 M 40 28 H 50" />
    
    <!-- VS Text -->
    <text x="72" y="58" font-family="sans-serif" font-size="22" font-weight="900" fill="#3b82f6">VS</text>

    <!-- Chess Pawn outline -->
    <path class="ink" d="M 115 65 H 135 L 132 50 C 135 42, 115 42, 118 50 Z" />
    <circle cx="125" cy="38" r="7" class="ink" />
  </g>
</svg>
