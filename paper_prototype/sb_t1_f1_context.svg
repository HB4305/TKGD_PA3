<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">

<style>
  .bg { fill: #faf9f6; }
  .frame { fill: none; stroke: #1c1712; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
  .ink { fill: none; stroke: #1c1712; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .ink-thin { fill: none; stroke: #1c1712; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ink-thick { fill: none; stroke: #1c1712; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
  .head { fill: #ffffff; stroke: #1c1712; stroke-width: 3.2; }
  .eye { fill: #1c1712; }
  .shade { fill: #e2e8f0; opacity: 0.7; }
  .shade-dark { fill: #cbd5e1; opacity: 0.8; }
  .accent-yellow { fill: #fbbf24; opacity: 0.9; }
  .accent-amber { fill: #f59e0b; }
  .accent-red { fill: #ef4444; }
  .accent-green { fill: #10b981; }
  .accent-blue { fill: #3b82f6; }
  .stroke-red { stroke: #ef4444; stroke-width: 3; stroke-dasharray: 6 4; fill: none; stroke-linecap: round; }
  .stroke-green { stroke: #10b981; stroke-width: 3.5; fill: none; stroke-linecap: round; }
  .stroke-blue { stroke: #3b82f6; stroke-width: 3; fill: none; stroke-linecap: round; }
  .phone-body { fill: #ffffff; stroke: #1c1712; stroke-width: 3; rx: 10; }
  .phone-screen { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 6; }
</style>

  <rect class="bg" width="400" height="500" rx="16"/>
  <rect class="frame" x="8" y="8" width="384" height="484" rx="12"/>

  <!-- Background campus details (Trees & Buildings) -->
  <!-- Building outline -->
  <path class="ink-thin" d="M 40 260 L 40 140 L 130 140 L 130 260 Z" />
  <path class="shade" d="M 40 140 H 130 V 260 H 40 Z" />
  <path class="ink-thin" d="M 60 160 H 80 V 190 H 60 Z M 90 160 H 110 V 190 H 90 Z" />
  <path class="ink-thin" d="M 60 210 H 80 V 240 H 60 Z M 90 210 H 110 V 240 H 90 Z" />
  
  <!-- Clock tower distant background -->
  <path class="ink-thin" d="M 150 260 V 110 L 165 85 L 180 110 V 260" />
  <circle cx="165" cy="130" r="8" class="ink-thin" />

  <!-- Trees -->
  <path class="shade" d="M 280 260 C 270 200, 310 160, 340 190 C 370 170, 390 210, 375 260 Z" />
  <path class="ink-thin" d="M 280 260 C 270 200, 310 160, 340 190 C 370 170, 390 210, 375 260 Z" />
  <path class="ink" d="M 330 260 V 300" />

  <!-- Pathway -->
  <path class="shade" d="M 10 440 Q 180 340 120 260 H 220 Q 240 340 390 440 Z" />
  <path class="ink-thin" d="M 10 440 Q 180 340 120 260" />
  <path class="ink-thin" d="M 390 440 Q 240 340 220 260" />
  <!-- Ground Line -->
  <path class="ink-thick" d="M 20 440 H 380" />

  <!-- Character (Ninh walking while using phone) -->
  <!-- Shadow on ground -->
  <ellipse cx="205" cy="438" rx="45" ry="8" class="shade-dark" />

  <!-- Legs walking stance -->
  <path class="ink" d="M 200 330 L 175 435 L 160 435" /> <!-- Left leg -->
  <path class="ink" d="M 200 330 L 235 430 L 250 432" /> <!-- Right leg -->

  <!-- Body / Torso -->
  <path class="shade" d="M 185 240 C 185 230, 215 230, 215 240 L 210 330 H 190 Z" />
  <path class="ink" d="M 185 240 C 185 230, 215 230, 215 240 L 210 330 H 190 Z" />

  <!-- Left Arm swinging slightly -->
  <path class="ink" d="M 185 245 L 165 295" />

  <!-- Right Arm holding phone in front -->
  <path class="ink" d="M 210 245 L 240 280 L 225 290" />
  <!-- Hand holding phone -->
  <circle cx="225" cy="290" r="5" class="head" />

  <!-- Head looking down at phone -->
  <circle cx="200" cy="190" r="32" class="head" />
  <!-- Eyes looking down-right -->
  <circle cx="212" cy="195" r="3.5" class="eye" />
  <circle cx="222" cy="195" r="3.5" class="eye" />
  <!-- Neutral/focused line mouth -->
  <path class="ink-thin" d="M 212 210 Q 218 212 222 210" />

  <!-- Smartphone held in hand -->
  <rect x="222" y="265" width="24" height="42" rx="4" class="phone-body" transform="rotate(-15 222 265)" />
  <rect x="224" y="268" width="20" height="36" rx="2" class="accent-yellow" transform="rotate(-15 222 265)" />
  <!-- Glow rays around phone screen -->
  <path class="ink-thin" stroke="#f59e0b" stroke-width="2" d="M 245 255 L 255 248 M 252 268 L 264 265 M 240 245 L 244 235" />

  <!-- Motion dashes near feet -->
  <path class="ink-thin" d="M 145 435 H 155 M 255 432 H 268" />
</svg>
