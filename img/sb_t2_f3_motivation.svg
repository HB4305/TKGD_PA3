<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">

<style>
  .bg { fill: #faf9f6; }
  .frame { fill: none; stroke: #1c1712; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
  .ink { fill: none; stroke: #1c1712; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .ink-thin { fill: none; stroke: #1c1712; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ink-thick { fill: none; stroke: #1c1712; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
  .head { fill: #ffffff; stroke: #1c1712; stroke-width: 3.2; }
  .eye { fill: #1c1712; }
  .accent-yellow { fill: #fbbf24; opacity: 0.9; }
  .phone-body { fill: #ffffff; stroke: #1c1712; stroke-width: 3; rx: 14; }
  .phone-screen { fill: #fffaf0; stroke: #1c1712; stroke-width: 2; rx: 8; }
</style>

  <rect class="bg" width="400" height="500" rx="16"/>
  <rect class="frame" x="8" y="8" width="384" height="484" rx="12"/>

  <!-- Idea bulb above phone -->
  <g transform="translate(185, 22)">
    <path class="accent-yellow" d="M 20 10 C 5 10, 0 25, 10 38 C 15 44, 18 50, 18 55 H 22 C 22 50, 25 44, 30 38 C 40 25, 35 10, 20 10 Z" />
    <path class="ink" d="M 20 10 C 5 10, 0 25, 10 38 C 15 44, 18 50, 18 55 H 22 C 22 50, 25 44, 30 38 C 40 25, 35 10, 20 10 Z" />
    <rect x="16" y="55" width="8" height="6" class="ink" />
    <path stroke="#f59e0b" stroke-width="3" stroke-linecap="round" d="M 20 -2 V 6 M -2 20 H 6 M 34 20 H 42 M 4 4 L 10 10 M 36 4 L 30 10" />
  </g>

  <!-- Character on left pointing excitedly -->
  <circle cx="80" cy="140" r="30" class="head" />
  <circle cx="88" cy="135" r="3" class="eye" />
  <circle cx="98" cy="135" r="3" class="eye" />
  <path class="ink" d="M 85 152 Q 93 162 101 152" /> <!-- Happy open smile -->
  <path class="ink-thick" d="M 80 170 V 250 M 80 200 L 130 180" />

  <!-- Phone UI Solution Replica (Date Filter + Date Strip + Match Cards with Detail -> Button) -->
  <g transform="translate(145, 95)">
    <rect x="0" y="0" width="225" height="370" rx="18" class="phone-body" />
    <rect x="10" y="15" width="205" height="340" rx="10" class="phone-screen" />

    <!-- 1. Top Dropdown Filters: Month & Year -->
    <g transform="translate(20, 26)">
      <!-- Month Dropdown -->
      <rect x="0" y="0" width="95" height="22" rx="5" fill="#ffffff" stroke="#1c1712" stroke-width="1.5" />
      <text x="10" y="15" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1c1712">August</text>
      <path d="M 78 8 L 83 14 L 88 8 Z" fill="#1c1712" />

      <!-- Year Dropdown -->
      <rect x="105" y="0" width="60" height="22" rx="5" fill="#ffffff" stroke="#1c1712" stroke-width="1.5" />
      <text x="113" y="15" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1c1712">2026</text>
      <path d="M 150 8 L 155 14 L 160 8 Z" fill="#1c1712" />
    </g>

    <!-- 2. Date Strip Bar (Scrollable chips) -->
    <g transform="translate(18, 56)">
      <rect x="0" y="0" width="169" height="32" rx="6" fill="#ffffff" stroke="#1c1712" stroke-width="1.5" />
      <!-- Chevron Left -->
      <text x="6" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1c1712">⟨</text>
      
      <!-- Date Chips -->
      <rect x="18" y="4" width="22" height="23" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <text x="24" y="19" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1c1712">19</text>

      <rect x="44" y="4" width="22" height="23" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <text x="50" y="19" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1c1712">20</text>

      <!-- Active Date Chip (21) -->
      <rect x="70" y="4" width="24" height="23" rx="4" fill="#224f44" stroke="#1c1712" stroke-width="1.5" />
      <text x="76" y="19" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">21</text>

      <rect x="98" y="4" width="22" height="23" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <text x="104" y="19" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1c1712">22</text>

      <rect x="124" y="4" width="22" height="23" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <text x="130" y="19" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1c1712">23</text>

      <!-- Chevron Right -->
      <text x="153" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1c1712">⟩</text>
    </g>

    <!-- 3. Section Title -->
    <text x="20" y="104" font-family="sans-serif" font-size="9.5" font-weight="900" fill="#e02e00" letter-spacing="0.05em">MATCHES FOR AUG 21</text>

    <!-- 4. Match Card 1 (World Chess Championship) -->
    <g transform="translate(18, 112)">
      <rect x="0" y="0" width="169" height="58" rx="8" fill="#ffffff" stroke="#1c1712" stroke-width="1.6" />
      <text x="10" y="16" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#1c1712">World Chess Championship</text>
      <text x="10" y="29" font-family="sans-serif" font-size="8" font-weight="600" fill="#64748b">Germany 2026 · Final (1 - 0)</text>
      
      <!-- Detail -> Button Bar -->
      <rect x="6" y="34" width="157" height="18" rx="4" fill="#ffe1d4" stroke="#1c1712" stroke-width="1.2" />
      <text x="84" y="47" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#e02e00" text-anchor="middle">Detail →</text>
    </g>

    <!-- 5. Match Card 2 (Semi-Final Rapid) - Styled matching exact user hand-drawn sketch -->
    <g transform="translate(18, 180)">
      <!-- Outer Card Frame -->
      <rect x="0" y="0" width="169" height="74" rx="8" fill="#ffffff" stroke="#1c1712" stroke-width="1.8" />
      
      <!-- Inner Content Container (matching outer box in sketch) -->
      <rect x="6" y="6" width="157" height="38" rx="5" fill="#f8fafc" stroke="#1c1712" stroke-width="1.2" />
      <text x="12" y="21" font-family="sans-serif" font-size="9.5" font-weight="bold" fill="#1c1712">Semi-Final Rapid</text>
      <text x="12" y="34" font-family="sans-serif" font-size="8" font-weight="600" fill="#64748b">Germany 2026 · (0.5 - 1.5)</text>
      
      <!-- Bottom Detail -> Button Bar (exact replica of user sketch) -->
      <rect x="6" y="48" width="157" height="20" rx="4" fill="#ffffff" stroke="#1c1712" stroke-width="1.5" />
      <text x="84" y="62" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1c1712" text-anchor="middle">Detail →</text>
    </g>

    <!-- Bottom Nav Bar Replica -->
    <g transform="translate(10, 312)">
      <line x1="0" y1="0" x2="185" y2="0" stroke="#1c1712" stroke-width="1" />
      <text x="15" y="20" font-family="sans-serif" font-size="14">📅</text>
      <text x="50" y="20" font-family="sans-serif" font-size="14">🎬</text>
      <text x="85" y="20" font-family="sans-serif" font-size="14">🏠</text>
      <text x="120" y="20" font-family="sans-serif" font-size="14">📰</text>
      <text x="155" y="20" font-family="sans-serif" font-size="14">•••</text>
    </g>
  </g>
</svg>
